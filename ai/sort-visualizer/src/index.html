<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sorting Algorithms Visualizer</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>

<body>
  <div class="container">
    <h1>Sorting Algorithms Visualizer</h1>
    <button id="generate">Generate Random Array</button>
    <div class="controls">
      <label for="speed">Animation Speed:</label>
      <input type="range" id="speed" min="1" max="100" value="50">
    </div>
    <div class="buttons">
      <button id="bubbleSort">Bubble Sort</button>
      <button id="quickSort">Quick Sort</button>
      <button id="mergeSort">Merge Sort</button>
      <button id="shellSort">Shell Sort</button>
      <button id="selectionSort">Selection Sort</button>
      <button id="insertionSort">Insertion Sort</button>
      <button id="pauseSort">Pause Sorting</button> <!-- Added button -->
    </div>
    <div id="arrayContainer"></div>
  </div>
</body>

</html>
